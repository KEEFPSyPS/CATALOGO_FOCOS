<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hella Catalogo</title>
  <!-- PWA manifest & theme -->
  <link rel="manifest" href="data:application/json,{}" />
  <meta name="theme-color" content="#0b2b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Firebase SDK (modular v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <style>
    /* ============================================================
       DESIGN SYSTEM · Hella Bulb Finder
       Estándares internacionales: variables CSS, tipografía,
       espaciado 8pt, elevación, estados de foco accesibles.
       ============================================================ */
    :root {
      /* Paleta */
      --color-primary: #0b2b4a;
      --color-primary-dark: #081f36;
      --color-primary-light: #1a4a6e;
      --color-accent: #f1c40f;
      --color-accent-dark: #d4a800;
      --color-surface: #ffffff;
      --color-surface-alt: #eef3f9;
      --color-border: #dfe8f2;
      --color-text: #1d3b5a;
      --color-text-muted: #7a8b9f;
      --color-text-faint: #9aa9b9;
      --color-danger: #b13e3e;
      --color-success: #1a5d3a;
      --color-success-bg: #dff0e6;

      /* Tipografía */
      --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-size-xs: 0.75rem;   /* 12px */
      --font-size-sm: 0.875rem;  /* 14px */
      --font-size-md: 1rem;      /* 16px */
      --font-size-lg: 1.125rem;  /* 18px */

      /* Espaciado (escala 8pt) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;

      /* Radios */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;

      /* Elevación */
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.14);
      --shadow-primary: 0 6px 12px rgba(11, 43, 74, 0.2);

      /* Transiciones */
      --transition-fast: 0.15s ease;
      --transition-base: 0.25s ease;

      /* Z-index */
      --z-modal: 1000;
      --z-overlay: 999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-family);
    }

    body {
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-4);
    }

    /* ============================================================
       APP CARD (vista principal y panel admin)
       ============================================================ */
    .app-card {
      max-width: 500px;
      width: 100%;
      background: var(--color-surface);
      border-radius: 40px 40px 32px 32px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      padding: var(--space-6) var(--space-5) var(--space-8);
      transition: var(--transition-base);
    }

    /* ============================================================
       HEADER / LOGO
       ============================================================ */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: 28px;
      position: relative;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .logo-placeholder {
      background: var(--color-surface);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }

    .logo-img {
      display: block;
      width: 84px;
      height: 84px;
      object-fit: contain;
      pointer-events: none;
    }

    /* ============================================================
       FILTROS
       ============================================================ */
    .filter-section {
      background: var(--color-surface-alt);
      border-radius: 28px;
      padding: var(--space-5) var(--space-4);
      margin-bottom: 28px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-row label {
      flex: 1 0 100%;
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }

    .filter-row input {
      flex: 1;
      min-width: 80px;
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--color-surface);
      font-size: 15px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-fast);
      outline: 1px solid transparent;
    }

    .filter-row input:focus {
      outline: 2px solid var(--color-primary-light);
      box-shadow: 0 4px 10px rgba(29, 111, 156, 0.15);
    }

    .btn-primary {
      background: var(--color-primary);
      border: none;
      padding: 14px 18px;
      border-radius: var(--radius-pill);
      color: var(--color-surface);
      font-weight: 700;
      font-size: var(--font-size-md);
      letter-spacing: 0.5px;
      width: 100%;
      margin-top: var(--space-3);
      cursor: pointer;
      transition: var(--transition-base);
      box-shadow: var(--shadow-primary);
    }

    .btn-primary:hover {
      background: var(--color-primary-light);
    }

    .btn-primary:active {
      transform: scale(0.97);
      background: var(--color-primary-light);
    }

    /* ============================================================
       RESULTADOS
       ============================================================ */
    .result-area {
      background: var(--color-surface);
      border-radius: 28px;
      padding: var(--space-3) var(--space-2);
      margin-top: var(--space-2);
      min-height: 80px;
      border: 1px solid var(--color-border);
    }

    .bulb-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      padding: var(--space-2) var(--space-1);
    }

    .bulb-tag {
      background: #e6edf6;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 500;
      color: var(--color-primary);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
      border: 1px solid #cddbe9;
      transition: var(--transition-fast);
    }

    .bulb-tag.hella {
      background: var(--color-accent);
      border-color: var(--color-accent-dark);
      color: #1d2f3f;
      font-weight: 600;
    }

    .empty-state {
      color: var(--color-text-muted);
      text-align: center;
      padding: 28px 10px;
      font-size: 15px;
      font-weight: 400;
    }

    /* ============================================================
       MODAL DE LOGIN (acceso secreto)
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 31, 54, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      z-index: var(--z-overlay);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition-base), visibility var(--transition-base);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      padding: var(--space-6);
      transform: translateY(24px) scale(0.96);
      opacity: 0;
      transition: transform var(--transition-base), opacity var(--transition-base);
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .modal-close:hover {
      background: var(--color-surface-alt);
      color: var(--color-text);
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .modal-body input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      font-size: 15px;
      transition: var(--transition-fast);
    }

    .modal-body input:focus {
      outline: 2px solid var(--color-primary-light);
      border-color: transparent;
    }

    .btn-login {
      background: var(--color-primary);
      border: none;
      padding: 14px 18px;
      border-radius: var(--radius-pill);
      color: var(--color-surface);
      font-weight: 700;
      font-size: var(--font-size-md);
      letter-spacing: 0.5px;
      width: 100%;
      margin-top: var(--space-2);
      cursor: pointer;
      transition: var(--transition-base);
      box-shadow: var(--shadow-primary);
    }

    .btn-login:hover {
      background: var(--color-primary-light);
    }

    .btn-login:active {
      transform: scale(0.97);
    }

    .status-msg {
      font-size: var(--font-size-sm);
      color: var(--color-success);
      margin-top: var(--space-2);
      padding: 6px 12px;
      background: var(--color-success-bg);
      border-radius: var(--radius-pill);
      display: inline-block;
    }

    .status-msg.error {
      color: var(--color-danger);
      background: #fbe9e9;
    }

    /* ============================================================
       PANEL DE ADMINISTRACIÓN (vista completa, no modal)
       ============================================================ */
    .admin-panel {
      display: none;
      max-width: 500px;
      width: 100%;
      background: var(--color-surface);
      border-radius: 40px 40px 32px 32px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      padding: var(--space-6) var(--space-5) var(--space-8);
    }

    .admin-panel.active {
      display: block;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .admin-header h2 {
      font-size: var(--font-size-lg);
      font-weight: 700;
      color: var(--color-primary);
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--color-border);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      color: var(--color-text);
      font-weight: 600;
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-back:hover {
      background: var(--color-surface-alt);
    }

    .admin-form {
      background: var(--color-surface-alt);
      border-radius: 24px;
      padding: var(--space-5) var(--space-4);
      margin-bottom: var(--space-5);
    }

    .admin-form h3 {
      font-size: var(--font-size-md);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: var(--space-4);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-3);
    }

    .form-row label {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
    }

    .form-row input {
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      font-size: 15px;
      transition: var(--transition-fast);
    }

    .form-row input:focus {
      outline: 2px solid var(--color-primary-light);
      border-color: transparent;
    }

    .form-row textarea {
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      font-size: 15px;
      min-height: 80px;
      resize: vertical;
      transition: var(--transition-fast);
    }

    .form-row textarea:focus {
      outline: 2px solid var(--color-primary-light);
      border-color: transparent;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: var(--space-2);
    }

    .btn-save {
      background: var(--color-primary);
      border: none;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      color: var(--color-surface);
      font-weight: 600;
      flex: 1;
      cursor: pointer;
      transition: var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .btn-save:hover {
      background: var(--color-primary-light);
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--color-border);
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      color: var(--color-text-muted);
      font-weight: 600;
      flex: 1;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-cancel:hover {
      background: var(--color-surface-alt);
    }

    .btn-delete {
      background: var(--color-danger);
      border: none;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      color: var(--color-surface);
      font-weight: 600;
      flex: 1;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-delete:hover {
      filter: brightness(1.1);
    }

    .inventory-list {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: var(--space-3);
      max-height: 320px;
      overflow-y: auto;
    }

    .inventory-list h3 {
      font-size: var(--font-size-md);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: var(--space-3);
      padding: 0 var(--space-2);
    }

    .inventory-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      transition: var(--transition-fast);
      border-bottom: 1px solid var(--color-border);
    }

    .inventory-item:last-child {
      border-bottom: none;
    }

    .inventory-item:hover {
      background: var(--color-surface-alt);
    }

    .inventory-info {
      flex: 1;
      min-width: 0;
    }

    .inventory-info strong {
      display: block;
      font-size: 15px;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inventory-info span {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .inventory-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .icon-btn:hover {
      background: var(--color-surface-alt);
    }

    .icon-btn.edit:hover {
      color: var(--color-primary-light);
    }

    .icon-btn.delete:hover {
      color: var(--color-danger);
    }

    .footer-note {
      text-align: center;
      margin-top: var(--space-5);
      font-size: var(--font-size-xs);
      color: var(--color-text-faint);
      letter-spacing: 0.3px;
    }

    /* ============================================================
       ADAPTACIÓN RESPONSIVA
       ============================================================ */
    @media (max-width: 420px) {
      .app-card, .admin-panel { padding: var(--space-4); }
      .logo-text { font-size: 15px; }
      .modal { padding: var(--space-5); }
    }
  </style>
</head>
<body>
  <!-- ============ VISTA PRINCIPAL ============ -->
  <div class="app-card" id="app">
    <!-- HEADER con logo (acceso secreto: 5 clicks, sin pistas) -->
    <div class="header" id="headerLogo">
      <div class="logo-placeholder">
        <img src="img/Logo_HEPA.png" alt="HEPA logo" class="logo-img">
      </div>
    </div>

    <!-- Filtros -->
    <div class="filter-section">
      <div class="filter-group">
        <div class="filter-row">
          <label>Armadora</label>
          <input type="text" id="inputMake" placeholder="ej. Toyota, Ford" value="Toyota">
        </div>
        <div class="filter-row">
          <label>Modelo</label>
          <input type="text" id="inputModel" placeholder="ej. Corolla, F-150" value="Corolla">
        </div>
        <div class="filter-row">
          <label>Año</label>
          <input type="text" id="inputYear" placeholder="ej. 2020" value="2020">
        </div>
        <button class="btn-primary" id="filterBtn">🔍 Filtrar focos</button>
      </div>
    </div>

    <!-- Resultados -->
    <div class="result-area" id="resultArea">
      <div class="empty-state" id="emptyState">🔎 Los focos Hella aparecerán aquí</div>
      <div class="bulb-grid" id="bulbGrid"></div>
    </div>

    <div class="footer-note">Hella · compatible con PWA</div>
  </div>

  <!-- ============ PANEL DE ADMINISTRACIÓN (vista completa) ============ -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <h2>⚙️ Panel de administración</h2>
      <button class="btn-back" id="backBtn">← Volver</button>
    </div>

    <!-- Formulario para agregar/editar -->
    <div class="admin-form">
      <h3 id="formTitle">➕ Agregar nuevo registro</h3>
      <div class="form-row">
        <label for="invMake">Armadora</label>
        <input type="text" id="invMake" placeholder="ej. Toyota">
      </div>
      <div class="form-row">
        <label for="invModel">Modelo</label>
        <input type="text" id="invModel" placeholder="ej. Corolla">
      </div>
      <div class="form-row">
        <label for="invYear">Año</label>
        <input type="text" id="invYear" placeholder="ej. 2020">
      </div>
      <div class="form-row">
        <label for="invBulbs">Focos (separados por coma)</label>
        <textarea id="invBulbs" placeholder="Luz baja, Luz alta, Antiniebla"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-save" id="saveBtn">💾 Guardar</button>
        <button class="btn-cancel" id="cancelBtn">Cancelar</button>
      </div>
      <div id="adminStatus" class="status-msg">Listo para administrar inventario</div>
    </div>

    <!-- Lista de inventario -->
    <div class="inventory-list">
      <h3>📦 Inventario actual</h3>
      <div id="inventoryItems"></div>
    </div>
  </div>

  <!-- ============ MODAL DE LOGIN (acceso secreto) ============ -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-header">
        <div class="modal-title" id="loginTitle">🔐 Acceso</div>
        <button class="modal-close" id="closeModalBtn" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body">
        <input type="email" id="adminEmail" placeholder="correo@ejemplo.com" value="admin@hella.com">
        <input type="password" id="adminPass" placeholder="contraseña" value="hella123">
        <button class="btn-login" id="loginBtn">Ingresar</button>
        <div id="loginStatus" class="status-msg">Ingresa tus credenciales</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- CONFIGURACIÓN FIREBASE ----------
      const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyNoUsarEnProduccion",  // Reemplazar con credenciales reales
        authDomain: "tu-proyecto.firebaseapp.com",
        projectId: "tu-proyecto-id",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
      };

      // Inicializar Firebase (si no está ya)
      let app, db;
      try {
        app = firebase.initializeApp(firebaseConfig);
        db = firebase.firestore(app);
        console.log('Firebase inicializado');
      } catch (e) {
        console.warn('Firebase init error (usando mock):', e);
        db = null;
      }

      // ---------- ELEMENTOS DOM (vista principal) ----------
      const inputMake = document.getElementById('inputMake');
      const inputModel = document.getElementById('inputModel');
      const inputYear = document.getElementById('inputYear');
      const filterBtn = document.getElementById('filterBtn');
      const bulbGrid = document.getElementById('bulbGrid');
      const emptyState = document.getElementById('emptyState');
      const headerLogo = document.getElementById('headerLogo');
      const appCard = document.getElementById('app');

      // ---------- ELEMENTOS DOM (login modal) ----------
      const loginModal = document.getElementById('loginModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const adminEmail = document.getElementById('adminEmail');
      const adminPass = document.getElementById('adminPass');
      const loginBtn = document.getElementById('loginBtn');
      const loginStatus = document.getElementById('loginStatus');

      // ---------- ELEMENTOS DOM (panel admin) ----------
      const adminPanel = document.getElementById('adminPanel');
      const backBtn = document.getElementById('backBtn');
      const formTitle = document.getElementById('formTitle');
      const invMake = document.getElementById('invMake');
      const invModel = document.getElementById('invModel');
      const invYear = document.getElementById('invYear');
      const invBulbs = document.getElementById('invBulbs');
      const saveBtn = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const adminStatus = document.getElementById('adminStatus');
      const inventoryItems = document.getElementById('inventoryItems');

      // ---------- ESTADO ----------
      let clickCount = 0;
      let lastClickTime = 0;
      let localBulbs = [];
      let editingId = null; // ID del registro en edición

      // ---------- DATOS DE EJEMPLO (Hella bulbs) ----------
      const DEFAULT_BULBS = [
        { make: 'Toyota', model: 'Corolla', year: '2020', bulbs: ['Luz baja', 'Luz alta', 'Direccional delantera', 'Cuartos delanteros'] },
        { make: 'Toyota', model: 'Corolla', year: '2021', bulbs: ['Luz baja', 'Luz alta', 'Direccional delantera', 'Cuartos traseros'] },
        { make: 'Ford', model: 'F-150', year: '2019', bulbs: ['Luz baja', 'Luz alta', 'Antiniebla', 'Direccional trasera', 'Freno'] },
        { make: 'Ford', model: 'F-150', year: '2020', bulbs: ['Luz alta', 'Antiniebla', 'Cuartos delanteros', 'Reversa', 'Placa'] },
        { make: 'Chevrolet', model: 'Silverado', year: '2018', bulbs: ['Luz baja', 'Luz alta', 'Direccional delantera', 'Direccional trasera', 'Cuartos traseros', 'Freno'] },
        { make: 'Chevrolet', model: 'Silverado', year: '2019', bulbs: ['Luz baja', 'Antiniebla', 'Direccional delantera', 'Reversa', 'Domo'] },
        { make: 'Honda', model: 'Civic', year: '2022', bulbs: ['Luz baja', 'Luz alta', 'Direccional delantera', 'Cuartos delanteros', 'Freno', 'Reversa'] },
        { make: 'Volkswagen', model: 'Jetta', year: '2020', bulbs: ['Luz baja', 'Luz alta', 'Direccional trasera', 'Cuartos traseros', 'Placa', 'Domo'] },
        { make: 'Nissan', model: 'Sentra', year: '2021', bulbs: ['Luz baja', 'Luz alta', 'Antiniebla', 'Direccional delantera', 'Reversa'] },
        { make: 'Hyundai', model: 'Elantra', year: '2022', bulbs: ['Luz baja', 'Luz alta', 'Direccional trasera', 'Cuartos traseros', 'Freno', 'Placa'] },
      ];

      // ---------- FUNCIONES DE BASE DE DATOS (Firestore) ----------
      function loadFromFirestore() {
        if (!db) {
          localBulbs = [...DEFAULT_BULBS];
          renderBulbs(localBulbs);
          renderInventory();
          return Promise.resolve();
        }
        return db.collection('hellaBulbs').get()
          .then(snapshot => {
            if (snapshot.empty) {
              localBulbs = [...DEFAULT_BULBS];
              renderBulbs(localBulbs);
              renderInventory();
              return;
            }
            const docs = [];
            snapshot.forEach(doc => {
              const data = doc.data();
              data._id = doc.id;
              docs.push(data);
            });
            localBulbs = docs.length ? docs : [...DEFAULT_BULBS];
            renderBulbs(localBulbs);
            renderInventory();
          })
          .catch(err => {
            console.warn('Error Firestore:', err);
            localBulbs = [...DEFAULT_BULBS];
            renderBulbs(localBulbs);
            renderInventory();
          });
      }

      // Guardar un registro (agregar o actualizar)
      function saveRecord(record) {
        if (!db) {
          // Modo offline: guardar localmente
          if (editingId) {
            const idx = localBulbs.findIndex(r => r._id === editingId);
            if (idx !== -1) localBulbs[idx] = { ...record, _id: editingId };
          } else {
            record._id = 'local_' + Date.now();
            localBulbs.push(record);
          }
          renderBulbs(localBulbs);
          renderInventory();
          adminStatus.textContent = '✅ Guardado (modo local)';
          return Promise.resolve();
        }

        const collection = db.collection('hellaBulbs');
        if (editingId) {
          // Actualizar registro existente
          const { _id, ...data } = record;
          return collection.doc(editingId).set(data)
            .then(() => {
              const idx = localBulbs.findIndex(r => r._id === editingId);
              if (idx !== -1) localBulbs[idx] = { ...record, _id: editingId };
              renderBulbs(localBulbs);
              renderInventory();
              adminStatus.textContent = '✅ Registro actualizado en Firebase';
            })
            .catch(err => {
              console.error('Error actualizando:', err);
              adminStatus.textContent = '❌ Error al actualizar';
            });
        } else {
          // Agregar nuevo registro
          const { _id, ...data } = record;
          return collection.add(data)
            .then(docRef => {
              record._id = docRef.id;
              localBulbs.push(record);
              renderBulbs(localBulbs);
              renderInventory();
              adminStatus.textContent = '✅ Registro agregado a Firebase';
            })
            .catch(err => {
              console.error('Error agregando:', err);
              adminStatus.textContent = '❌ Error al agregar';
            });
        }
      }

      // Eliminar un registro
      function deleteRecord(id) {
        if (!db) {
          localBulbs = localBulbs.filter(r => r._id !== id);
          renderBulbs(localBulbs);
          renderInventory();
          adminStatus.textContent = '🗑️ Eliminado (modo local)';
          return Promise.resolve();
        }
        return db.collection('hellaBulbs').doc(id).delete()
          .then(() => {
            localBulbs = localBulbs.filter(r => r._id !== id);
            renderBulbs(localBulbs);
            renderInventory();
            adminStatus.textContent = '🗑️ Registro eliminado de Firebase';
          })
          .catch(err => {
            console.error('Error eliminando:', err);
            adminStatus.textContent = '❌ Error al eliminar';
          });
      }

      // ---------- RENDER FILTRADO (vista principal) ----------
      function renderBulbs(bulbsArray) {
        const make = inputMake.value.trim().toLowerCase();
        const model = inputModel.value.trim().toLowerCase();
        const year = inputYear.value.trim();

        const filtered = bulbsArray.filter(item => {
          const matchMake = item.make?.toLowerCase().includes(make) || make === '';
          const matchModel = item.model?.toLowerCase().includes(model) || model === '';
          const matchYear = item.year?.toString().includes(year) || year === '';
          return matchMake && matchModel && matchYear;
        });

        const order = ['Luz baja', 'Luz alta', 'Antiniebla', 'Cuartos delanteros', 'Direccional delantera', 'Direccional trasera', 'Cuartos traseros', 'Freno', 'Reversa', 'Placa', 'Domo'];
        const bulbSet = new Set();
        filtered.forEach(item => {
          if (Array.isArray(item.bulbs)) {
            item.bulbs.forEach(b => bulbSet.add(b));
          }
        });
        const sorted = Array.from(bulbSet).sort((a, b) => {
          const ia = order.indexOf(a);
          const ib = order.indexOf(b);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });

        bulbGrid.innerHTML = '';
        emptyState.style.display = 'none';

        if (sorted.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = '🚗 No se encontraron focos para este vehículo';
          return;
        }

        sorted.forEach(bulb => {
          const tag = document.createElement('span');
          tag.className = 'bulb-tag hella';
          tag.textContent = bulb;
          bulbGrid.appendChild(tag);
        });
      }

      function applyFilter() {
        renderBulbs(localBulbs);
      }

      // ---------- RENDER INVENTARIO (panel admin) ----------
      function renderInventory() {
        if (!inventoryItems) return;
        inventoryItems.innerHTML = '';

        if (localBulbs.length === 0) {
          inventoryItems.innerHTML = '<div class="empty-state">No hay registros en el inventario</div>';
          return;
        }

        localBulbs.forEach(item => {
          const div = document.createElement('div');
          div.className = 'inventory-item';

          const info = document.createElement('div');
          info.className = 'inventory-info';
          const strong = document.createElement('strong');
          strong.textContent = `${item.make} ${item.model} ${item.year}`;
          const span = document.createElement('span');
          span.textContent = Array.isArray(item.bulbs) ? item.bulbs.join(', ') : '';
          info.appendChild(strong);
          info.appendChild(span);

          const actions = document.createElement('div');
          actions.className = 'inventory-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'icon-btn edit';
          editBtn.textContent = '✏️';
          editBtn.title = 'Editar';
          editBtn.addEventListener('click', () => startEdit(item));

          const delBtn = document.createElement('button');
          delBtn.className = 'icon-btn delete';
          delBtn.textContent = '🗑️';
          delBtn.title = 'Eliminar';
          delBtn.addEventListener('click', () => {
            if (confirm(`¿Eliminar ${item.make} ${item.model} ${item.year}?`)) {
              deleteRecord(item._id);
            }
          });

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          div.appendChild(info);
          div.appendChild(actions);
          inventoryItems.appendChild(div);
        });
      }

      // ---------- LOGIN: ABRIR / CERRAR MODAL ----------
      function openLoginModal() {
        loginModal.classList.add('open');
        loginStatus.textContent = 'Ingresa tus credenciales';
        loginStatus.className = 'status-msg';
        setTimeout(() => adminEmail.focus(), 250);
      }

      function closeLoginModal() {
        loginModal.classList.remove('open');
        clickCount = 0;
      }

      // ---------- PANEL ADMIN: ABRIR / CERRAR ----------
      function openAdminPanel() {
        appCard.style.display = 'none';
        adminPanel.classList.add('active');
        renderInventory();
      }

      function closeAdminPanel() {
        adminPanel.classList.remove('active');
        appCard.style.display = '';
        resetForm();
      }

      // ---------- FORMULARIO: RESET / EDITAR ----------
      function resetForm() {
        editingId = null;
        formTitle.textContent = '➕ Agregar nuevo registro';
        invMake.value = '';
        invModel.value = '';
        invYear.value = '';
        invBulbs.value = '';
        adminStatus.textContent = 'Listo para administrar inventario';
        adminStatus.className = 'status-msg';
      }

      function startEdit(item) {
        editingId = item._id;
        formTitle.textContent = '✏️ Editar registro';
        invMake.value = item.make || '';
        invModel.value = item.model || '';
        invYear.value = item.year || '';
        invBulbs.value = Array.isArray(item.bulbs) ? item.bulbs.join(', ') : '';
        adminStatus.textContent = 'Editando registro...';
        adminStatus.className = 'status-msg';
      }

      // ---------- ADMIN: 5 CLICKS EN LOGO (acceso secreto) ----------
      headerLogo.addEventListener('click', function(e) {
        e.stopPropagation();
        const now = Date.now();
        if (now - lastClickTime > 2000) clickCount = 0;
        clickCount++;
        lastClickTime = now;
        if (clickCount >= 5) {
          clickCount = 0;
          openLoginModal();
        }
      });

      // Cerrar modal de login
      closeModalBtn.addEventListener('click', closeLoginModal);

      // Cerrar al hacer clic fuera del modal
      loginModal.addEventListener('click', function(e) {
        if (e.target === loginModal) closeLoginModal();
      });

      // Cerrar con tecla Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && loginModal.classList.contains('open')) {
          closeLoginModal();
        }
      });

      // ---------- LOGIN: VERIFICAR CREDENCIALES ----------
      loginBtn.addEventListener('click', function() {
        const email = adminEmail.value.trim();
        const pass = adminPass.value.trim();
        if (email === '' || pass === '') {
          loginStatus.textContent = '⚠️ Correo y contraseña requeridos';
          loginStatus.className = 'status-msg error';
          return;
        }
        if (email === 'admin@hella.com' && pass === 'hella123') {
          loginStatus.textContent = '✅ Acceso concedido';
          loginStatus.className = 'status-msg';
          setTimeout(() => {
            closeLoginModal();
            openAdminPanel();
          }, 400);
        } else {
          loginStatus.textContent = '❌ Credenciales incorrectas';
          loginStatus.className = 'status-msg error';
        }
      });

      // ---------- PANEL ADMIN: BOTONES ----------
      backBtn.addEventListener('click', closeAdminPanel);

      cancelBtn.addEventListener('click', resetForm);

      saveBtn.addEventListener('click', function() {
        const make = invMake.value.trim();
        const model = invModel.value.trim();
        const year = invYear.value.trim();
        const bulbsRaw = invBulbs.value.trim();

        if (!make || !model || !year) {
          adminStatus.textContent = '⚠️ Armadora, modelo y año son requeridos';
          adminStatus.className = 'status-msg error';
          return;
        }

        const bulbs = bulbsRaw
          .split(',')
          .map(b => b.trim())
          .filter(b => b.length > 0);

        const record = { make, model, year, bulbs };
        saveRecord(record).then(() => {
          resetForm();
        });
      });

      // ---------- EVENTOS ----------
      filterBtn.addEventListener('click', applyFilter);

      [inputMake, inputModel, inputYear].forEach(inp => {
        inp.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') applyFilter();
        });
      });

      // ---------- INICIO: cargar datos por defecto ----------
      if (db) {
        loadFromFirestore().then(() => {
          if (localBulbs.length === 0) {
            localBulbs = [...DEFAULT_BULBS];
            renderBulbs(localBulbs);
            renderInventory();
          }
        });
      } else {
        localBulbs = [...DEFAULT_BULBS];
        renderBulbs(localBulbs);
        renderInventory();
      }

      setTimeout(applyFilter, 100);

      if ('serviceWorker' in navigator) {
        console.log('PWA ready');
      }

    })();
  </script>
</body>
</html>
